<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Согласование</title>
    <script src="//api.bitrix24.com/api/v1/"></script>
    <style>
        body { margin: 0; padding: 5px; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
        .btn-container { display: flex; gap: 8px; align-items: center; }
        .btn {
            border: none;
            padding: 7px 14px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            color: #fff;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-approve { background-color: #2fc6f6; }
        .btn-notes { background-color: #f7a700; }
        .btn-reject { background-color: #ff5752; }
    </style>
</head>
<body>

<div class="btn-container">
    <button class="btn btn-approve" id="btn-approve" onclick="onDecision('APPROVE')">Согласовать</button>
    <button class="btn btn-notes" id="btn-notes" onclick="onDecision('NOTES')">Согласовать с замечаниями</button>
    <button class="btn btn-reject" id="btn-reject" onclick="onDecision('REJECT')">Отклонить</button>
</div>

<script>
    let taskId = null;

    BX24.init(function() {
        const options = BX24.placement.info().options;
        taskId = options.taskId;
    });

    function setButtonsLoading(loading) {
        document.querySelectorAll('.btn').forEach(btn => btn.disabled = loading);
    }

    async function onDecision(type) {
        if (!taskId) {
            alert('Не найден ID задачи.');
            return;
        }

        let comment = '';

        if (type === 'NOTES') {
            comment = prompt('Укажите замечания к документу:');
            if (comment === null) return;
        } else if (type === 'REJECT') {
            comment = prompt('Укажите причину отклонения:');
            if (comment === null) return;
        }

        setButtonsLoading(true);

        try {
            const taskData = await callMethod('tasks.task.get', { id: taskId, select: ['ID', 'UF_CRM_TASK'] });
            const crmFields = taskData.task.ufCrmTask || [];
            
            const smartBinding = crmFields.find(item => item.startsWith('T'));

            let statusText = '';

            if (type === 'APPROVE') {
                statusText = '✅ Документ СОГЛАСОВАН.';
            } else if (type === 'NOTES') {
                statusText = '⚠️ Документ СОГЛАСОВАН С ЗАМЕЧАНИЯМИ:\n' + comment;
            } else if (type === 'REJECT') {
                statusText = '❌ Документ ОТКЛОНЕН.\nПричина: ' + comment;
            }

            await callMethod('task.commentitem.add', [taskId, { POST_MESSAGE: statusText }]);

            if (smartBinding) {
                const parts = smartBinding.substring(1).split('_');
                const entityTypeId = parts[0];
                const itemId = parts[1];

                await callMethod('crm.timeline.comment.add', {
                    fields: {
                        ENTITY_ID: itemId,
                        ENTITY_TYPE: 'dynamic_' + entityTypeId,
                        COMMENT: statusText
                    }
                });
            }

            await callMethod('tasks.task.complete', { id: taskId });

            BX24.reloadWindow();

        } catch (error) {
            alert('Произошла ошибка: ' + (error.message || JSON.stringify(error)));
            setButtonsLoading(false);
        }
    }

    function callMethod(method, params) {
        return new Promise((resolve, reject) => {
            BX24.callMethod(method, params, function(result) {
                if (result.error()) {
                    reject(result.error());
                } else {
                    resolve(result.data());
                }
            });
        });
    }
</script>

</body>
</html>
