<script>
    // Защита от ошибки 405 на GitHub Pages при POST-запросе от Битрикс24
    if (window.location.search.indexOf('redirected=1') === -1 && document.referrer.indexOf('bitrix') !== -1) {
        window.location.replace(window.location.href.split('?')[0] + '?redirected=1');
    }
</script>
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Согласование</title>
    <script src="https://api.bitrix24.com/api/v1/"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            background-color: #f8f9fa;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h3 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
            margin-bottom: 16px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            color: #fff;
        }
        .btn:active { transform: scale(0.98); }
        .btn-success { background-color: #2fc6f6; }
        .btn-success:hover { background-color: #1ab2e2; }
        .btn-warning { background-color: #f7a700; }
        .btn-warning:hover { background-color: #df9600; }
        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }
        .status-info { background: #e3f2fd; color: #0d47a1; }
        .status-success { background: #e8f5e9; color: #1b5e20; }
        .status-error { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>

<div class="container">
    <h3>Панель согласования</h3>
    <div class="btn-group">
        <button class="btn btn-success" onclick="processApproval('approve_gd')">Согласовать с ГД</button>
        <button class="btn btn-warning" onclick="processApproval('correction')">На корректировку</button>
    </div>
    <div id="status" class="status-msg"></div>
</div>

<script>
    // ==========================================
    // ⚙️ НАСТРОЙКИ
    // ==========================================
    var SMART_PROCESS_ID = 1070; // 👈 ВАШ ID СМАРТ-ПРОЦЕССА

    var STAGE_APPROVED_GD = 'DT1070_26:CLIENT'; // 👈 ВАША СТАДИЯ "Согласовано с ГД"
    var STAGE_CORRECTION  = 'DT1070_26:UC_GDBXKW';      // 👈 ВАША СТАДИЯ "На корректировку"

    var currentEntityId = null;

    BX24.init(function() {
        // Выполняем автоматическую регистрацию вкладок при запуске приложения
        BX24.callMethod('placement.bind', {
            PLACEMENT: 'CRM_DYNAMIC_' + SMART_PROCESS_ID + '_DETAIL_TAB',
            HANDLER: 'https://maksimilli.github.io/bitrix/approval.html',
            TITLE: 'Согласование'
        });

        BX24.callMethod('placement.bind', {
            PLACEMENT: 'TASK_CARD_TAB',
            HANDLER: 'https://maksimilli.github.io/bitrix/approval.html',
            TITLE: 'Согласование'
        });

        var options = BX24.placement.info();
        if (options && options.options) {
            currentEntityId = options.options.ID || options.options.ENTITY_ID;
        }
        
        BX24.resizeWindow(document.body.scrollWidth, 200);
    });

    function showStatus(text, type) {
        var el = document.getElementById('status');
        el.className = 'status-msg status-' + type;
        el.innerText = text;
        el.style.display = 'block';
    }

    function processApproval(action) {
        if (!currentEntityId) {
            showStatus('Ошибка: не удалось определить ID элемента.', 'error');
            return;
        }

        showStatus('Обработка...', 'info');

        var targetStage = (action === 'approve_gd') ? STAGE_APPROVED_GD : STAGE_CORRECTION;
        var messageText = (action === 'approve_gd') ? 'Согласовано с ГД' : 'Отправлено на корректировку';

        BX24.callMethod(
            'crm.item.update',
            {
                entityTypeId: SMART_PROCESS_ID,
                id: currentEntityId,
                fields: { stageId: targetStage }
            },
            function(result) {
                if (result.error()) {
                    showStatus('Ошибка обновления: ' + result.error(), 'error');
                } else {
                    showStatus('Успешно: ' + messageText, 'success');
                }
            }
        );
    }
</script>

</body>
</html>
