<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Подключаем REST API Битрикс24 -->
    <script src="//api.bitrix24.com/api/v1/"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; padding: 0; background: #fff; }
        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-green { background-color: #2fc6f6; } /* Согласовать */
        .btn-orange { background-color: #f5a623; } /* На корректировку */
        .btn-red { background-color: #ff5752; }    /* Отклонить */
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 12px; font-size: 13px; color: #555; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="loader" class="status">Загрузка панели...</div>

    <div id="content" class="hidden">
        <div class="btn-group">
            <button id="btn-approve" class="btn btn-green">Согласовать</button>
            <button id="btn-correct" class="btn btn-orange">На корректировку</button>
            <button id="btn-reject" class="btn btn-red">Отклонить</button>
        </div>
        <div id="msg" class="status"></div>
    </div>

    <script>
        // ==========================================
        //  НАСТРОЙКИ (Укажите свои ID)
        // ==========================================
        var SMART_PROCESS_ID = 18; // ID вашего Смарт-процесса

        // Системные коды стадий (подробнее в Шаге 2)
        var STAGE_GD = 'DT1070_26:CLIENT'; // Стадия "Согласование у ГД"
        var STAGE_CORRECT = 'DT1070_26:UC_GDBXKW'; // Стадия "На корректировке"
        // ==========================================

        var currentSmartId = null;
        var currentTaskId = null;

        BX24.init(function() {
            var info = BX24.placement.info();
            
            // Если открыли из Задачи
            if (info.placement === 'TASK_CARD_TAB') {
                currentTaskId = info.options.TASK_ID;
                findSmartProcessByTask(currentTaskId);
            } else {
                // Если открыли из самого Смарт-процесса
                currentSmartId = info.options.ID;
                initWidget();
            }
        });

        // Находим смарт-процесс, связанный с задачей
        function findSmartProcessByTask(taskId) {
            BX24.callMethod('tasks.task.get', { id: taskId, select: ['ID', 'UF_CRM_TASK'] }, function(res) {
                if (res.error()) { showMsg('Ошибка: ' + res.error()); return; }
                
                var bindings = res.data().task.ufCrmTask || [];
                var prefix = 'DYNAMIC_' + SMART_PROCESS_ID + '_';

                for (var i = 0; i < bindings.length; i++) {
                    if (bindings[i].indexOf(prefix) === 0) {
                        currentSmartId = bindings[i].replace(prefix, '');
                        break;
                    }
                }

                if (currentSmartId) {
                    initWidget();
                } else {
                    document.getElementById('loader').innerText = 'Эта задача не привязана к процессу согласования.';
                }
            });
        }

        function initWidget() {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');

            document.getElementById('btn-approve').onclick = function() {
                moveStage(STAGE_GD, 'Переведено на стадию "Согласование у ГД"');
            };
            document.getElementById('btn-correct').onclick = function() {
                moveStage(STAGE_CORRECT, 'Переведено на стадию "На корректировке"');
            };
            document.getElementById('btn-reject').onclick = function() {
                showMsg('Кнопка "Отклонить" нажата (действие настроим отдельно)');
            };
        }

        // Переключение стадии смарт-процесса
        function moveStage(newStage, successText) {
            toggleButtons(true);
            showMsg('Сохранение...');

            BX24.callMethod('crm.item.update', {
                entityTypeId: SMART_PROCESS_ID,
                id: currentSmartId,
                fields: { stageId: newStage }
            }, function(res) {
                toggleButtons(false);
                if (res.error()) {
                    showMsg('Ошибка смены стадии: ' + res.error().ex.error_description);
                } else {
                    showMsg('Успешно: ' + successText);
                    
                    // Если кликали из задачи — добавляем комментарий
                    if (currentTaskId) {
                        BX24.callMethod('task.commentitem.add', [
                            currentTaskId, 
                            { POST_MESSAGE: 'Результат согласования: ' + successText }
                        ]);
                    }
                }
            });
        }

        function toggleButtons(disabled) {
            var btns = document.querySelectorAll('.btn');
            btns.forEach(function(b) { b.disabled = disabled; });
        }

        function showMsg(text) {
            document.getElementById('msg').innerText = text;
        }
    </script>
</body>
</html>
